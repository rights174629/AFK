<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbfa">
  <meta name="description" content="AFK - 인터랙티브 웹 프로젝트 & 실시간 웹 허브 포털">
  <meta name="keywords" content="AFK, 웹프로젝트, 인터랙티브웹, 장작불, Keep the Fire Alive">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AFK - Games and Web Toys">
  <meta property="og:description" content="AFK에서 제작한 인터랙티브 웹 프로젝트 모음">

  <title>AFK - Games and Web Toys</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>

  <!-- 포털 상단 브랜딩 헤더 (W3C Semantic Header) -->
  <header class="portal-header" role="banner">
    <a href="index.html" class="brand-container" aria-label="AFK 메인 홈">
      <span class="brand-title">AFK</span>
      <span class="brand-icon-wrapper" aria-hidden="true">🔥</span>
    </a>
    <p class="portal-subtitle">games and stuff by AFK</p>
  </header>

  <!-- 메인 프로젝트 쇼케이스 (W3C Semantic Main) -->
  <main class="portal-main" role="main">
    <section class="portal-grid" aria-label="웹 프로젝트 목록">

      <!-- 1. [대표 서비스] Keep the Fire Alive (동기화된 하나의 장작불) -->
      <a href="fire.html" class="portal-card-link" aria-label="Keep the Fire Alive - 실시간 장작불 웹사이트로 이동">
        <article class="portal-card card-fire">
          <div class="fire-live-badge">
            <span class="live-pulse-dot" aria-hidden="true"></span>
            <span>LIVE</span>
          </div>
          <div class="fire-visual-group">
            <div class="fire-pixel-icon" aria-hidden="true">🪵 🔥</div>
            <h2 class="fire-title">Keep the Fire Alive</h2>
            <p class="fire-desc">전 세계가 함께 돌보는 하나의 실시간 장작불 & 힐링 공간</p>
          </div>
        </article>
      </a>

      <!-- 2. 다음 프로젝트 슬롯 (Coming Soon) -->
      <article class="portal-card card-placeholder" aria-label="다음 프로젝트 준비 중 슬롯">
        <div class="placeholder-icon" aria-hidden="true">✨</div>
        <div class="placeholder-title">Next Project</div>
        <div class="placeholder-desc">새로운 인터랙티브 토이가 곧 추가됩니다</div>
      </article>

    </section>
  </main>

  <!-- 푸터 (W3C Semantic Footer) -->
  <footer class="portal-footer" role="contentinfo">
    <p>© 2026 AFK · Built with Web Standards & HTML5</p>
  </footer>

</body>
</html>
